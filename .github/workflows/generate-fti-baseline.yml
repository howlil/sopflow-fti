name: Generate FTI Baseline

on:
  push:
    branches:
      - refactor/fti-native-migration-baseline
    paths:
      - '.github/workflows/generate-fti-baseline.yml'
      - 'server/prisma/schema.prisma'
      - 'server/prisma.config.ts'
      - 'server/package.json'
      - 'server/pnpm-lock.yaml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3308
      DATABASE_USER: sop_test
      DATABASE_PASSWORD: sop_test_password
      DATABASE_NAME: sop_fti_source
      DATABASE_URL: mysql://sop_test:sop_test_password@127.0.0.1:3308/sop_fti_source
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/fti-native-migration-baseline

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate schema
        run: pnpm exec prisma validate

      - name: Generate clean FTI baseline SQL
        run: >-
          pnpm exec prisma migrate diff
          --from-empty
          --to-schema prisma/schema.prisma
          --script
          --output prisma/fti-baseline.generated.sql

      - name: Start source MariaDB
        run: |
          docker run --detach --name sop-baseline-source-db --publish 3308:3306 \
            --env MARIADB_ROOT_PASSWORD=root_test_password \
            --env MARIADB_DATABASE=sop_fti_source \
            --env MARIADB_USER=sop_test --env MARIADB_PASSWORD=sop_test_password \
            --env TZ=Asia/Jakarta mariadb:11.4 --lower_case_table_names=1
          for attempt in $(seq 1 60); do
            docker exec sop-baseline-source-db healthcheck.sh --connect --innodb_initialized >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs sop-baseline-source-db
          exit 1

      - name: Materialize current target database
        run: pnpm exec prisma migrate deploy

      - name: Capture active triggers
        run: |
          docker exec sop-baseline-source-db mariadb -uroot -proot_test_password --batch --skip-column-names \
            -e "SELECT TRIGGER_NAME, EVENT_MANIPULATION, EVENT_OBJECT_TABLE, ACTION_TIMING, ACTION_STATEMENT FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA = 'sop_fti_source' ORDER BY TRIGGER_NAME" \
            > prisma/fti-triggers.generated.tsv

      - name: Prove baseline reconciliation without reset
        run: |
          mv prisma/migrations prisma/migrations.pre-squash
          mkdir -p prisma/migrations/0_fti_native_baseline prisma/migrations/1_fti_native_invariants
          cp prisma/fti-baseline.generated.sql prisma/migrations/0_fti_native_baseline/migration.sql
          cp prisma/fti-invariants.generated.sql prisma/migrations/1_fti_native_invariants/migration.sql
          cp prisma/migrations.pre-squash/migration_lock.toml prisma/migrations/migration_lock.toml
          pnpm exec prisma migrate resolve --applied 0_fti_native_baseline
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate status
          pnpm exec prisma generate
          pnpm db:audit:fti

      - name: Prove target trigger set
        run: |
          actual="$(docker exec sop-baseline-source-db mariadb -uroot -proot_test_password --batch --skip-column-names \
            -e "SELECT TRIGGER_NAME FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA = 'sop_fti_source' ORDER BY TRIGGER_NAME")"
          expected="$(printf '%s\n' \
            trg_detailsop_one_effective_insert \
            trg_detailsop_one_effective_update \
            trg_langkahsop_cabang_detail_insert \
            trg_langkahsop_cabang_detail_update \
            trg_langkahsop_pelaksana_swimlane_insert \
            trg_langkahsop_pelaksana_swimlane_update \
            trg_process_scope_department_insert \
            trg_process_scope_department_update \
            trg_sop_terkait_insert \
            trg_sop_terkait_update)"
          test "$actual" = "$expected"

      - name: Commit generated baseline evidence
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/prisma/fti-baseline.generated.sql server/prisma/fti-triggers.generated.tsv
          git diff --cached --quiet && exit 0
          git commit -m 'chore(db): generate FTI native baseline evidence'
          git push origin HEAD:refactor/fti-native-migration-baseline
