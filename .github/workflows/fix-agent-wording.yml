name: Fix Agent Wording

on:
  push:
    branches: [refactor/fti-only-final-cleanup]
    paths: ['.github/workflows/fix-agent-wording.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fti-only-final-cleanup
          fetch-depth: 0
      - name: Fix target-role wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            '.agents/skill/backend/SKILL.md': {
              'propagate legacy retired organization model/Pemilik Proses semantics into new target-domain abstractions;':
                'propagate retired organization/workflow-role semantics into new target-domain abstractions;',
            },
            '.agents/skill/frontend/SKILL.md': {
              'old Pemilik Proses-role semantics': 'retired workflow-role semantics',
              'propagate legacy retired organization model/Pemilik Proses semantics into new target UI;':
                'propagate retired organization/workflow-role semantics into new target UI;',
            },
          }
          for name, mapping in replacements.items():
            path = Path(name)
            text = path.read_text(encoding='utf-8')
            for old, new in mapping.items():
              text = text.replace(old, new)
            path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-agent-wording.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: correct FTI role wording'
          git push origin HEAD:refactor/fti-only-final-cleanup
