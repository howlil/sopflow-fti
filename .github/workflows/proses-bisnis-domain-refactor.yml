name: Proses Bisnis Refactor Diagnostic

on:
  push:
    branches:
      - refactor/fti-only-final-cleanup

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            server/pnpm-lock.yaml
            client/pnpm-lock.yaml

      - name: Server frozen install
        id: server_install
        continue-on-error: true
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        if: steps.server_install.outcome == 'success'
        continue-on-error: true
        working-directory: server
        run: pnpm exec prisma validate

      - name: Prisma generate
        id: prisma_generate
        if: steps.server_install.outcome == 'success'
        continue-on-error: true
        working-directory: server
        run: pnpm exec prisma generate

      - name: Server typecheck
        if: steps.server_install.outcome == 'success' && steps.prisma_generate.outcome == 'success'
        continue-on-error: true
        working-directory: server
        run: pnpm typecheck

      - name: Client frozen install
        id: client_install
        continue-on-error: true
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Client typecheck
        if: steps.client_install.outcome == 'success'
        continue-on-error: true
        working-directory: client
        run: pnpm typecheck

      - name: Deliberately fail when a diagnostic step failed
        if: always()
        run: |
          echo "Review prior step outcomes in this diagnostic run."
          test "${{ steps.server_install.outcome }}" = "success"
          test "${{ steps.client_install.outcome }}" = "success"
