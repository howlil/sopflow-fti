name: Bersihkan Residue Istilah Proses Bisnis

on:
  push:
    branches:
      - refactor/fti-only-final-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_PASSWORD: ci-not-used
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            server/pnpm-lock.yaml
            client/pnpm-lock.yaml

      - name: Bersihkan residue path dan vocabulary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          renames = {
              'client/e2e/journeys/fti-department-approval.spec.ts': 'client/e2e/journeys/fti-departemen-approval.spec.ts',
              'client/e2e/journeys/fti-department-context.spec.ts': 'client/e2e/journeys/fti-departemen-context.spec.ts',
              'client/e2e/journeys/fti-department-review.spec.ts': 'client/e2e/journeys/fti-departemen-review.spec.ts',
              'client/e2e/journeys/fti-department-tte-public.spec.ts': 'client/e2e/journeys/fti-departemen-tte-public.spec.ts',
              'client/e2e/journeys/fti-department-version-replacement.spec.ts': 'client/e2e/journeys/fti-departemen-version-replacement.spec.ts',
              'client/e2e/support/fti-process-actions.ts': 'client/e2e/support/fti-proses-bisnis-actions.ts',
              'client/e2e/support/fti-process-preconditions.ts': 'client/e2e/support/fti-proses-bisnis-preconditions.ts',
              'client/src/pages/public/arsip/components/arsip-process-sidebar.tsx': 'client/src/pages/public/arsip/components/arsip-proses-bisnis-sidebar.tsx',
          }
          for old, new in renames.items():
              if Path(old).exists():
                  subprocess.run(['git', 'mv', old, new], check=True)

          replacements = {
              'fti-department-approval.spec': 'fti-departemen-approval.spec',
              'fti-department-context.spec': 'fti-departemen-context.spec',
              'fti-department-review.spec': 'fti-departemen-review.spec',
              'fti-department-tte-public.spec': 'fti-departemen-tte-public.spec',
              'fti-department-version-replacement.spec': 'fti-departemen-version-replacement.spec',
              'fti-process-actions': 'fti-proses-bisnis-actions',
              'fti-process-preconditions': 'fti-proses-bisnis-preconditions',
              'arsip-process-sidebar': 'arsip-proses-bisnis-sidebar',
              'Organizational authority': 'Pejabat berwenang',
          }
          for root in (Path('client'), Path('server'), Path('.agents')):
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.ts', '.tsx', '.md', '.json'}:
                      continue
                  if 'server/prisma/migrations/' in path.as_posix() or 'server/src/generated/' in path.as_posix():
                      continue
                  text = path.read_text(encoding='utf-8')
                  original = text
                  for old, new in replacements.items():
                      text = text.replace(old, new)
                  if text != original:
                      path.write_text(text, encoding='utf-8')
          PY

      - name: Server validate
        working-directory: server
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prisma validate
          pnpm exec prisma generate
          pnpm typecheck

      - name: Client typecheck
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: bersihkan residue istilah Proses Bisnis"
          git push origin HEAD:refactor/fti-only-final-cleanup
