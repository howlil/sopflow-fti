name: Server CI

on:
  push:
    paths:
      - 'server/src/**'
      - 'server/package.json'
      - 'server/pnpm-lock.yaml'
      - 'server/pnpm-workspace.yaml'
      - 'server/tsconfig*.json'
      - 'server/nest-cli.json'
      - 'server/prisma/*.prisma'
      - 'server/prisma.config.ts'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'server/src/**'
      - 'server/package.json'
      - 'server/pnpm-lock.yaml'
      - 'server/pnpm-workspace.yaml'
      - 'server/tsconfig*.json'
      - 'server/nest-cli.json'
      - 'server/prisma/*.prisma'
      - 'server/prisma.config.ts'
      - '.github/workflows/server-ci.yml'

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_PASSWORD: ci-not-used

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm prisma validate

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit — common/config/database
        run: pnpm exec jest common config database --runInBand

      - name: Unit — core/auth
        if: always()
        run: pnpm exec jest modules/core/auth --runInBand

      - name: Unit — core/pengguna
        if: always()
        run: pnpm exec jest modules/core/pengguna --runInBand

      - name: Unit — core/peraturan
        if: always()
        run: pnpm exec jest modules/core/peraturan --runInBand

      - name: Unit — core/proses-bisnis
        if: always()
        run: pnpm exec jest modules/core/proses-bisnis --runInBand

      - name: Unit — notifications/boundaries
        if: always()
        run: pnpm exec jest notification-module-boundaries.spec.ts --runInBand

      - name: Unit — notifications/proses-bisnis
        if: always()
        run: pnpm exec jest modules/notifications/proses-bisnis --runInBand

      - name: Unit — notifications/shared
        if: always()
        run: pnpm exec jest modules/notifications/shared --runInBand

      - name: Unit — SOP/catalog
        if: always()
        run: pnpm exec jest modules/sop/catalog --runInBand

      - name: Unit — SOP/collaboration
        if: always()
        run: pnpm exec jest modules/sop/collaboration --runInBand

      - name: Unit — SOP/diagram
        if: always()
        run: pnpm exec jest modules/sop/diagram --runInBand

      - name: Unit — SOP/pdf
        if: always()
        run: pnpm exec jest modules/sop/pdf --runInBand

      - name: Unit — SOP/pelaksana
        if: always()
        run: pnpm exec jest modules/sop/pelaksana --runInBand

      - name: Unit — SOP/penyusunan-proses-bisnis
        if: always()
        run: pnpm exec jest modules/sop/penyusunan-proses-bisnis --runInBand

      - name: Unit — SOP/prosedur
        if: always()
        run: pnpm exec jest modules/sop/prosedur --runInBand

      - name: Unit — SOP/public
        if: always()
        run: pnpm exec jest modules/sop/public --runInBand

      - name: Unit — TTE
        if: always()
        run: pnpm exec jest modules/tte --runInBand
