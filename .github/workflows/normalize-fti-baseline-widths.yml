name: Normalize FTI Baseline Widths

on:
  push:
    branches:
      - refactor/fti-native-migration-baseline
    paths:
      - '.github/workflows/normalize-fti-baseline-widths.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_PASSWORD: ci-generation-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/fti-native-migration-baseline

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize canonical string capacities
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('prisma/schema.prisma')
          source = path.read_text()
          replacements = [
              ('  email                     String           @unique @db.VarChar(31)', '  email                     String           @unique @db.VarChar(255)'),
              ('  nama                      String           @db.VarChar(31)', '  nama                      String           @db.VarChar(255)'),
              ('  kataSandi                 String           @db.Char(60)', '  kataSandi                 String           @db.VarChar(60)'),
              ('  nip                       String           @unique @db.Char(18)', '  nip                       String           @unique @db.VarChar(32)'),
              ('  jabatan                   String           @db.VarChar(28)', '  jabatan                   String           @db.VarChar(255)'),
              ('  pangkat                   String           @db.VarChar(25)', '  pangkat                   String           @db.VarChar(64)'),
              ('  nohp                      String           @db.VarChar(13)', '  nohp                      String           @db.VarChar(32)'),
              ('  refreshTokenHash          String?          @db.Char(60)', '  refreshTokenHash          String?          @db.VarChar(60)'),
              ('  ttePinHash                String?          @db.Char(60)', '  ttePinHash                String?          @db.VarChar(60)'),
              ('  nama           String    @db.VarChar(31)', '  nama           String    @db.VarChar(500)'),
              ('  nomor          String    @db.VarChar(28)', '  nomor          String    @db.VarChar(255)'),
              ('  tentang        String    @db.VarChar(73)', '  tentang        String    @db.VarChar(2000)'),
              ('  judul      String      @db.VarChar(42)', '  judul      String      @db.VarChar(500)'),
              ('  nomorSOP                       String                           @unique @db.VarChar(24)', '  nomorSOP                       String                           @unique @db.VarChar(255)'),
              ('  namaLembaga                    String                           @db.VarChar(28)', '  namaLembaga                    String                           @db.VarChar(2000)'),
              ('  kegiatan                   String                    @db.VarChar(55)', '  kegiatan                   String                    @db.VarChar(2000)'),
              ('  kelengkapan                String                    @db.VarChar(34)', '  kelengkapan                String                    @db.VarChar(2000)'),
              ('  keluaran                   String                    @db.VarChar(23)', '  keluaran                   String                    @db.VarChar(2000)'),
              ('  keterangan                 String                    @db.VarChar(37)', '  keterangan                 String                    @db.VarChar(2000)'),
              ('  nama        String               @unique(map: "Pelaksana_nama_key") @db.VarChar(15)', '  nama        String               @unique(map: "Pelaksana_nama_key") @db.VarChar(255)'),
              ('  email               String                  @db.VarChar(31)', '  email               String                  @db.VarChar(255)'),
              ('  nama                String                  @db.VarChar(31)', '  nama                String                  @db.VarChar(255)'),
              ('  nip                 String                  @db.Char(18)', '  nip                 String                  @db.VarChar(32)'),
              ('  jabatan              String                  @db.VarChar(28)', '  jabatan              String                  @db.VarChar(255)'),
              ('  pangkat              String                  @db.VarChar(25)', '  pangkat              String                  @db.VarChar(64)'),
              ('  nohp                 String                  @db.VarChar(13)', '  nohp                 String                  @db.VarChar(32)'),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match for {old!r}, found {count}')
              source = source.replace(old, new)
          path.write_text(source)
          PY

      - name: Validate and regenerate canonical baseline
        run: |
          pnpm exec prisma validate
          pnpm exec prisma migrate diff \
            --from-empty \
            --to-schema prisma/schema.prisma \
            --script \
            --output prisma/migrations/0_fti_native_baseline/migration.sql

      - name: Commit normalized baseline and remove one-shot workflow
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/normalize-fti-baseline-widths.yml
          git add server/prisma/schema.prisma server/prisma/migrations/0_fti_native_baseline/migration.sql
          git commit -m 'fix(db): align canonical schema capacities with target database'
          git push origin HEAD:refactor/fti-native-migration-baseline
