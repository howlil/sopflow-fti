name: Finalisasi Istilah Proses Bisnis

on:
  push:
    branches:
      - refactor/fti-only-final-cleanup

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_PASSWORD: ci-not-used
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            server/pnpm-lock.yaml
            client/pnpm-lock.yaml

      - name: Terapkan finalizer
        run: python3 server/scripts/proses-bisnis-refactor-repair.py

      - name: Koreksi kontrak client non-domain
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          # `scope` here is Playwright worker configuration, not domain lingkup.
          fixture = Path('client/e2e/fixtures/business-test.ts')
          text = fixture.read_text(encoding='utf-8')
          text = text.replace("{ lingkup: 'worker' }", "{ scope: 'worker' }")
          fixture.write_text(text, encoding='utf-8')

          # Preserve Node.js global process in the E2E bootstrap.
          setup = Path('client/e2e/global-setup.ts')
          text = setup.read_text(encoding='utf-8')
          text = text.replace('...prosesBisnis.env', '...process.env')
          text = text.replace('prosesBisnis.env', 'process.env')
          text = text.replace('prosesBisnis.platform', 'process.platform')
          setup.write_text(text, encoding='utf-8')

          # Persetujuan is a domain DTO as well, so rename the file instead of leaving a hybrid import.
          old = Path('client/src/types/dto/approval.dto.ts')
          new = Path('client/src/types/dto/persetujuan.dto.ts')
          if old.exists() and not new.exists():
              subprocess.run(['git', 'mv', old.as_posix(), new.as_posix()], check=True)

          for path in Path('client').rglob('*.ts*'):
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace("./process.dto", "./proses-bisnis.dto")
              text = text.replace("@/types/dto/approval.dto", "@/types/dto/persetujuan.dto")
              if text != original:
                  path.write_text(text, encoding='utf-8')

          # The archive formatter's parameter is domain data, not the global Node `process` object.
          archive = Path('client/src/pages/public/arsip/hooks/use-arsip-browse.ts')
          text = archive.read_text(encoding='utf-8')
          text = text.replace('function formatProsesBisnisContext(process:', 'function formatProsesBisnisContext(prosesBisnis:')
          text = text.replace('process.lingkup', 'prosesBisnis.lingkup')
          text = text.replace('process.namaDepartemen', 'prosesBisnis.namaDepartemen')
          text = text.replace('process.nama', 'prosesBisnis.nama')
          archive.write_text(text, encoding='utf-8')
          PY

      - name: Server install
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma
        working-directory: server
        run: |
          pnpm exec prisma validate
          pnpm exec prisma generate

      - name: Server typecheck
        working-directory: server
        run: pnpm typecheck

      - name: Client install and typecheck
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "refactor: tuntaskan istilah domain Proses Bisnis"
          git push origin HEAD:refactor/fti-only-final-cleanup
