# Do not set a fixed top-level Compose project name here. MyPaaS supplies a
# unique project name with `-p` so each deployment gets an isolated network.

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command:
      - --lower_case_table_names=1
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      # Physical database name is intentionally preserved. The persistent
      # sop-arsip_db_data volume was initialized with this schema name; changing
      # MARIADB_DATABASE later does not rename/create a database in that volume.
      MARIADB_DATABASE: sop_biro_organisasi
      MARIADB_USER: sop_app
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      # Fast polling removes up to ~13s of avoidable wait after MariaDB is ready.
      # start_period/retries still leave ample room for a real cold DB boot.
      start_period: 30s
      interval: 2s
      timeout: 2s
      retries: 30

  backend:
    image: sop-arsip-backend
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:?set PUBLIC_APP_ORIGIN}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      TTE_ENCRYPTION_SECRET: ${TTE_ENCRYPTION_SECRET:?set TTE_ENCRYPTION_SECRET}
      DATABASE_HOST: db
      DATABASE_NAME: sop_biro_organisasi
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    volumes:
      - sop_pdf_data:/app/storage/sop-pdf
    expose:
      - "3001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/api/health/ready"]
      start_period: 90s
      interval: 2s
      timeout: 2s
      retries: 60

  frontend:
    image: sop-arsip-frontend
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      # Start nginx/SSR in parallel with backend initialization. Readiness below
      # still proxies the backend, so MyPaaS cannot publish a healthy frontend
      # before the backend and database are actually ready.
      backend:
        condition: service_started
    expose:
      - "8080"
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health/ready"]
      start_period: 90s
      interval: 2s
      timeout: 2s
      retries: 60

volumes:
  db_data:
    # Keep the established database volume name while the Compose network is
    # isolated by MyPaaS. This preserves the existing production data.
    name: sop-arsip_db_data
  sop_pdf_data:
    name: sop-arsip_sop_pdf_data
