name: Apply Final FTI Physical Reconciliation

on:
  push:
    branches:
      - refactor/fti-native-migration-baseline

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fti-native-migration-baseline
          fetch-depth: 0
      - name: Apply physical reconciliation
        run: python3 server/scripts/_reconcile-fti-baseline-physical.py
      - name: Remove one-time tooling
        run: |
          rm server/scripts/_reconcile-fti-baseline-physical.py
          rm .github/workflows/_fti-baseline-equivalence.yml
      - name: Commit reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(db): reconcile FTI baseline with target physical contract'
          git push origin HEAD:refactor/fti-native-migration-baseline
