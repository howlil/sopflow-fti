name: Temporary Worktree Export

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/_export-worktree.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: sopflow-worktree
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
