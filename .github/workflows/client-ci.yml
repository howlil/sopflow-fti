name: Client CI

on:
  push:
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and regenerate routes
        run: pnpm build

      - name: Verify generated route tree is committed
        run: |
          git diff -- src/routeTree.gen.ts
          git diff --exit-code -- src/routeTree.gen.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test
