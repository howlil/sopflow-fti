name: Migration Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'server/prisma/**/*.prisma'
      - 'server/prisma/migrations/**'
      - 'server/prisma/**/*.ts'
      - 'server/prisma.config.ts'
      - '.github/workflows/migration-smoke.yml'
  pull_request:
    paths:
      - 'server/prisma/**/*.prisma'
      - 'server/prisma/migrations/**'
      - 'server/prisma/**/*.ts'
      - 'server/prisma.config.ts'
      - '.github/workflows/migration-smoke.yml'

permissions:
  contents: read

concurrency:
  group: migration-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3307
      DATABASE_USER: sop_test
      DATABASE_PASSWORD: ci-migration-only
      DATABASE_NAME: sop_fti_test
      E2E_SEED_PASSWORD: MigrationSmoke-Manual-Only-123!

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start MariaDB
        run: |
          docker run --detach --name sop-migration-smoke-db --publish 3307:3306 \
            --env MARIADB_RANDOM_ROOT_PASSWORD=1 \
            --env MARIADB_DATABASE="$DATABASE_NAME" \
            --env MARIADB_USER="$DATABASE_USER" \
            --env MARIADB_PASSWORD="$DATABASE_PASSWORD" \
            --env TZ=Asia/Jakarta mariadb:11.4 --lower_case_table_names=1
      - name: Wait for MariaDB
        run: |
          for attempt in $(seq 1 60); do
            docker exec sop-migration-smoke-db healthcheck.sh --connect --innodb_initialized >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs sop-migration-smoke-db
          exit 1
      - name: Validate Prisma schema
        run: pnpm prisma validate
      - name: Generate Prisma client
        run: pnpm prisma generate
      - name: Apply FTI migration set
        run: pnpm prisma migrate deploy
      - name: Verify migration status
        run: pnpm prisma migrate status
      - name: Verify FTI migration set completeness
        run: |
          expected="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          applied="$(docker exec sop-migration-smoke-db mariadb -u"$DATABASE_USER" -p"$DATABASE_PASSWORD" -Nse "SELECT COUNT(*) FROM $DATABASE_NAME._prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL")"
          test "$applied" = "$expected"
      - name: Seed native FTI graph
        run: pnpm db:seed:e2e
      - name: Prove FTI database invariants
        run: pnpm db:audit:fti
