name: FTI Final Codemod

on:
  push:
    branches:
      - refactor/fti-only-final-cleanup
    paths:
      - '.automation/fti-final-codemod.py'
      - '.github/workflows/fti-final-codemod.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fti-only-final-cleanup
          fetch-depth: 0
      - name: Apply deterministic FTI-only cleanup
        run: python .automation/fti-final-codemod.py
      - name: Commit cleanup result
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No codemod changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: apply FTI-only final cleanup'
          git push origin HEAD:refactor/fti-only-final-cleanup
