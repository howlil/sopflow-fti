# MyPaaS supplies the Compose project name so every release gets an isolated network.

x-backend-build: &backend-build
  context: ./server
  dockerfile: Dockerfile

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command:
      - --lower_case_table_names=1
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      # Keep the physical schema name used by the persistent production volume.
      MARIADB_DATABASE: sop_biro_organisasi
      MARIADB_USER: sop_app
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 2s
      timeout: 2s
      retries: 30

  backend-bootstrap:
    image: sop-arsip-backend
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:?set PUBLIC_APP_ORIGIN}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      TTE_ENCRYPTION_SECRET: ${TTE_ENCRYPTION_SECRET:?set TTE_ENCRYPTION_SECRET}
      DATABASE_HOST: db
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    command: ["/usr/local/bin/sopflow-backend-bootstrap.sh"]

  backend:
    image: sop-arsip-backend
    build: *backend-build
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      backend-bootstrap:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:?set PUBLIC_APP_ORIGIN}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      TTE_ENCRYPTION_SECRET: ${TTE_ENCRYPTION_SECRET:?set TTE_ENCRYPTION_SECRET}
      DATABASE_HOST: db
      DATABASE_NAME: sop_biro_organisasi
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    entrypoint: ["/usr/local/bin/sopflow-db-bootstrap.sh"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend:
    image: sop-arsip-backend
    build: *backend-build
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:?set PUBLIC_APP_ORIGIN}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      TTE_ENCRYPTION_SECRET: ${TTE_ENCRYPTION_SECRET:?set TTE_ENCRYPTION_SECRET}
      DATABASE_HOST: db
      DATABASE_NAME: sop_biro_organisasi
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    volumes:
      - sop_pdf_data:/app/storage/sop-pdf
    expose:
      - "3001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/api/health/ready"]
      start_period: 30s
      interval: 2s
      timeout: 2s
      retries: 30

  frontend:
    image: sop-arsip-frontend
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    cap_drop:
      - ALL
    healthcheck:

      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health/ready"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
    name: sop-arsip_db_data
  sop_pdf_data:
    name: sop-arsip_sop_pdf_data
