name: Sync Project Pelaksana Domain

on:
  push:
    branches:
      - feat/global-pelaksana-catalog
    paths:
      - '.github/workflows/sync-project-pelaksana.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/global-pelaksana-catalog

      - name: Insert canonical Pelaksana domain rules
        run: python -c "import base64; exec(base64.b64decode(''))"

      - name: Commit project domain update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/PROJECT.md
          git commit -m 'docs(agents): define global Pelaksana domain'
          git push origin HEAD:feat/global-pelaksana-catalog
