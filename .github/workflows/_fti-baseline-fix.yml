name: Apply FTI Baseline Integrity Fixes

on:
  push:
    branches:
      - refactor/fti-native-migration-baseline

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fti-native-migration-baseline
          fetch-depth: 0
      - name: Apply deterministic repair
        run: python3 server/scripts/_apply-fti-baseline-fix.py
      - name: Remove temporary repair tooling
        run: |
          rm server/scripts/_apply-fti-baseline-fix.py
          rm .github/workflows/_fti-baseline-fix.yml
      - name: Commit repaired baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(db): preserve FTI physical integrity in baseline'
          git push origin HEAD:refactor/fti-native-migration-baseline
