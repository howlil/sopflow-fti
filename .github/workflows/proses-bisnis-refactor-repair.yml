name: Audit Akhir Istilah Proses Bisnis

on:
  push:
    branches:
      - refactor/fti-only-final-cleanup

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit vocabulary dan path domain aktif
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          excluded_prefixes = (
              'server/prisma/migrations/',
              'server/src/generated/',
              '.github/workflows/',
          )
          excluded_files = {
              'server/scripts/proses-bisnis-refactor-repair.py',
              'server/prisma/schema.prisma',
              'server/prisma/post-contraction-db-audit.ts',
              'server/prisma/cleanup-migration-smoke-probes.ts',
          }
          suffixes = {'.ts', '.tsx', '.js', '.cjs', '.mjs', '.md', '.json', '.yml', '.yaml'}
          content_patterns = {
              'ProcessOwner': re.compile(r'\bProcessOwner(?:Authority)?\b'),
              'ProcessMember': re.compile(r'\bProcessMember\b'),
              'ProcessReview': re.compile(r'\bProcessReview\b'),
              'ProcessLifecycle': re.compile(r'\bProcessLifecycle\b'),
              'ProcessInvitation': re.compile(r'\bProcessInvitation\b'),
              'ProcessAudit': re.compile(r'\bProcessAudit\b'),
              'ProcessFinalApproval': re.compile(r'\bProcessFinalApproval\b'),
              'ProcessNotification': re.compile(r'\bProcessNotification\b'),
              'ProcessReminder': re.compile(r'\bProcessReminder\b'),
              'OrganizationalAuthority': re.compile(r'\bOrganizationalAuthority(?:Assignment)?\b'),
              'Department type': re.compile(r'\bDepartment\b'),
              'processId': re.compile(r'\bprocessId\b'),
              'processName': re.compile(r'\bprocessName\b'),
              'departmentId': re.compile(r'\bdepartmentId\b'),
              'scopeKey': re.compile(r'\bscopeKey\b'),
              'authorityKey': re.compile(r'\bauthorityKey\b'),
              'ownerId': re.compile(r'\bownerId\b'),
              'memberIds': re.compile(r'\bmemberIds\b'),
              'English domain phrase': re.compile(
                  r'\b(?:Process Owner|Process Member|Process Review|Process Lifecycle|Process Invitation|Organizational Authority|Business Process|Department Process)\b',
                  re.I,
              ),
          }

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          tracked = [item for item in tracked if item]
          content_findings = []
          path_findings = []

          for rel in tracked:
              if rel.startswith(excluded_prefixes) or rel in excluded_files:
                  continue
              lower = rel.lower()
              name = Path(rel).name.lower()
              if (
                  '/process/' in lower
                  or '/processes/' in lower
                  or 'process-' in name
                  or name.startswith('process.')
                  or 'department-' in name
                  or name.startswith('department.')
                  or 'organizational-authority' in lower
              ):
                  path_findings.append(rel)

              path = Path(rel)
              if path.suffix not in suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  for label, pattern in content_patterns.items():
                      if pattern.search(line):
                          content_findings.append((rel, line_no, label, line.strip()))

          print('=== CONTENT RESIDUE ===')
          for rel, line_no, label, line in content_findings:
              print(f'{rel}:{line_no}: [{label}] {line}')
          print('=== PATH RESIDUE ===')
          for rel in path_findings:
              print(rel)
          print(f'RESIDUE_COUNTS content={len(content_findings)} paths={len(path_findings)}')

          if content_findings or path_findings:
              sys.exit(1)
          PY
