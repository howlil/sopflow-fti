name: Deployment Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'compose.yml'
      - '.env.example'
      - 'server/src/**'
      - 'server/Dockerfile'
      - 'server/docker-entrypoint.sh'
      - 'server/docker-bootstrap.sh'
      - 'server/.dockerignore'
      - 'server/package.json'
      - 'server/pnpm-lock.yaml'
      - 'server/pnpm-workspace.yaml'
      - 'server/prisma/**/*.prisma'
      - 'server/prisma/migrations/**'
      - 'server/prisma.config.ts'
      - 'client/src/**'
      - 'client/Dockerfile'
      - 'client/.dockerignore'
      - 'client/package.json'
      - 'client/pnpm-lock.yaml'
      - 'client/pnpm-workspace.yaml'
      - 'client/docker-entrypoint.sh'
      - 'client/nginx.conf'
      - 'client/production-server.mjs'
      - '.github/workflows/container-build.yml'
  pull_request:
    paths:
      - 'compose.yml'
      - '.env.example'
      - 'server/Dockerfile'
      - 'server/docker-entrypoint.sh'
      - 'server/docker-bootstrap.sh'
      - 'server/.dockerignore'
      - 'server/package.json'
      - 'server/pnpm-lock.yaml'
      - 'server/pnpm-workspace.yaml'
      - 'server/prisma/**/*.prisma'
      - 'server/prisma/migrations/**'
      - 'server/prisma.config.ts'
      - 'client/Dockerfile'
      - 'client/.dockerignore'
      - 'client/package.json'
      - 'client/pnpm-lock.yaml'
      - 'client/pnpm-workspace.yaml'
      - 'client/docker-entrypoint.sh'
      - 'client/nginx.conf'
      - 'client/production-server.mjs'
      - '.github/workflows/container-build.yml'

permissions:
  contents: read

concurrency:
  group: deployment-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production contract
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.example -f compose.yml config >/dev/null
          docker compose --env-file .env.example -f compose.yml config --format json > /tmp/compose.json

          compose_vars="$({ grep -oE '\$\{[A-Z0-9_]+' compose.yml || true; } | sed 's/${//' | sort -u)"
          example_vars="$(grep -E '^[A-Z0-9_]+=' .env.example | cut -d= -f1 | sort -u)"
          diff -u <(printf '%s\n' "$example_vars") <(printf '%s\n' "$compose_vars")

          test "$(node -p "require('./server/package.json').packageManager")" = 'pnpm@11.21.0'
          test "$(node -p "require('./client/package.json').packageManager")" = 'pnpm@11.21.0'
          grep -F 'corepack prepare pnpm@11.21.0 --activate' server/Dockerfile >/dev/null
          grep -F 'corepack prepare pnpm@11.21.0 --activate' client/Dockerfile >/dev/null
          grep -F 'entrypoint: ["/usr/local/bin/sopflow-db-bootstrap.sh"]' compose.yml >/dev/null
          grep -F 'condition: service_completed_successfully' compose.yml >/dev/null
          grep -F 'http://127.0.0.1:8080/healthz' compose.yml >/dev/null
          jq -e '.services.bootstrap.build != null and .services.backend.build != null and .services.frontend.build != null' /tmp/compose.json >/dev/null
          sh -n server/docker-bootstrap.sh
          sh -n client/docker-entrypoint.sh

      - name: Reproduce MyPaaS pre-pull
        run: docker compose --env-file .env.example -f compose.yml pull --ignore-buildable

          grep -F './node_modules/.bin/prisma migrate deploy' server/docker-bootstrap.sh >/dev/null
          grep -F 'exec node dist/src/main.js' server/docker-entrypoint.sh >/dev/null
          grep -F 'condition: service_started' compose.yml >/dev/null
          grep -F 'http://127.0.0.1:8080/api/health/ready' compose.yml >/dev/null
          sh -n server/docker-entrypoint.sh
          sh -n server/docker-bootstrap.sh

      - name: Build application images
        run: docker compose --env-file .env.example -f compose.yml build backend frontend

      - name: Start production Compose and wait for real readiness
        shell: bash
        run: |
          docker run --rm --network none \
            -e DATABASE_PASSWORD=ci-runtime-smoke-password \
            --entrypoint /app/node_modules/.bin/prisma \
            sop-arsip-backend --version
          docker run --rm --network none --entrypoint sh sop-arsip-backend -c 'test -f dist/src/database/seed/seed-initial.js && test -f dist/src/main.js'
          docker run --rm --network none --entrypoint sh sop-arsip-backend -c 'test -x /usr/local/bin/sopflow-backend-bootstrap.sh'
